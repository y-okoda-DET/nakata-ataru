<title>ひとりごとの周波数</title>
<meta property="og:title" content="ひとりごとの周波数">
<meta property="og:description" content="二〇一〇年四月、宵町。レコード屋でバイトする大学生の一年を、一週ずつ過ごす恋愛アドベンチャー。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@400;700;900&display=swap">
<style>
:root{
  --paper:#f4f1ea; --ink:#141414; --ink2:#3a3630; --muted:#6b6660; --desk:#cfc8b8; --red:#c8352f;
  --tone:radial-gradient(#141414 0.9px, transparent 1.3px);
  --toneD:radial-gradient(#141414 1.3px, transparent 1.7px);
  --f-text:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-say:"Zen Antique","Zen Old Mincho","Hiragino Mincho ProN",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
html,body{height:100%;}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;box-sizing:border-box;padding:8px 12px calc(6px + env(safe-area-inset-bottom,0px));gap:8px;user-select:none;-webkit-user-select:none;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 40px rgba(0,0,0,.18);}
.koma{border:3px solid var(--ink);background:#fff;position:relative;overflow:hidden;box-sizing:border-box;}
.vt{writing-mode:vertical-rl;text-orientation:mixed;}
.rotccw{display:inline-block;transform:rotate(-90deg);}
.tcy{text-combine-upright:all;}

/* HUD */
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px;font-size:12px;}
#hud[hidden]{display:none!important;}
.hud-l{display:flex;gap:8px;align-items:baseline;min-width:0;flex:1;white-space:nowrap;overflow:hidden;}
#hudPlace{overflow:hidden;text-overflow:ellipsis;}
#hudWeek{font-family:var(--f-text);font-weight:900;font-size:14px;letter-spacing:.08em;}
#hudDate,#hudPlace{color:var(--ink2);}
.hud-r{display:flex;gap:8px;align-items:center;}
#hudMoney{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;}
.life{display:flex;gap:2px;}
.life span{width:16px;height:17px;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;box-sizing:border-box;position:relative;background:#fff;}
.life .warn{background-image:var(--tone);background-size:4px 4px;}
.life .off{background:var(--ink);color:var(--paper);}
.life .off::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:1.5px;background:var(--red);transform:rotate(-35deg);}

/* stage */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;}
#stage[hidden]{display:none!important;}
#p1{flex:0 0 41%;}
#bgImg{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .35s;}
#darkOverlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 60% 72%,rgba(0,0,0,0) 0,rgba(0,0,0,0) 14%,rgba(10,10,10,.82) 46%,rgba(10,10,10,.92) 100%);}
#p1.dark #darkOverlay{opacity:1;}
#qBubble{position:absolute;left:10px;top:10px;max-height:calc(100% - 20px);background:#fff;border:2px solid var(--ink);border-radius:50%;padding:22px 16px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;}
#qBubble[hidden]{display:none!important;}
#qText{font-family:var(--f-say);font-size:15px;line-height:1.6;max-height:200px;}
#p2{flex:1;min-height:0;display:flex;gap:8px;position:relative;}
#face{flex:0 0 42%;}
#inset{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.7);transition:opacity .3s;}
#faceSvg{position:absolute;inset:0;background:#fff;transition:opacity .25s;}
#faceSvg svg{width:100%;height:100%;display:block;}
#face.nochar #faceSvg{opacity:0;}
.chimg{width:100%;height:100%;object-fit:cover;object-position:38% 0%;display:block;}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px;}
.seg{display:inline-flex;border:2px solid var(--ink);}
.seg button{min-height:40px;padding:0 12px;border:none;background:#fff;font-size:13px;}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
#txt{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;}
#txt.say{background-color:#fff;background-image:var(--tone);background-size:6px 6px;}
#txt.me{background-color:#fff;background-image:repeating-linear-gradient(135deg,rgba(20,20,20,.08) 0 2px,transparent 2px 7px);}
#bubble{position:absolute;inset:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-sizing:border-box;}
#txt.nar #bubble{inset:0;border:none;padding:16px 14px;}
#txt.say #bubble{border:2px solid var(--ink);border-radius:50%;padding:18% 14%;}
#txt.me #bubble{border:2px dashed var(--ink);border-radius:18px;padding:16px 12px;}
#txt.blank #bubble{opacity:0;}
#tail{position:absolute;left:-2px;top:44%;width:18px;height:18px;background:#fff;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);display:none;}
#txt.say #tail{display:block;}
#spk{position:absolute;top:6px;right:6px;font-family:var(--f-ui);font-weight:700;font-size:11px;background:var(--ink);color:var(--paper);padding:2px 7px;letter-spacing:.1em;}
#spk:empty{display:none;}
#txtBody{height:100%;max-height:100%;line-height:1.72;letter-spacing:.04em;white-space:pre-wrap;}
#txt.say #txtBody,#txt.me #txtBody{font-family:var(--f-say);}
#txt.nar #txtBody{font-family:var(--f-text);color:var(--ink2);}

/* choices */
#choices{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
#choices::-webkit-scrollbar{display:none;}
#choices .choice{width:100%;flex-shrink:0;}
#choices[hidden]{display:none!important;}
.choice{position:relative;flex:1 0 auto;min-height:64px;text-align:left;background:#fff;border:3px solid var(--ink);padding:14px 14px 12px;font-family:var(--f-say);font-size:16px;line-height:1.55;color:var(--ink);box-sizing:border-box;}
.choice:not([disabled]):hover{background:#fbf8f1;}
.choice:not([disabled]):active{transform:translate(1px,1px);}
.choice .tab{position:absolute;left:-3px;top:-3px;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-weight:700;font-size:11px;padding:4px 10px;letter-spacing:.08em;}
.tab.honest{background:var(--red);}
.tab.mute{background:#fff;color:var(--ink);border:1.5px solid var(--ink);}
.choice[disabled]{color:var(--muted);background-color:var(--paper);background-image:var(--tone);background-size:5px 5px;cursor:not-allowed;}
.choice[disabled] .ctext,.choice[disabled] .req{background:var(--paper);padding:0 3px;}
.choice .req{display:inline-block;margin-top:6px;font-family:var(--f-ui);font-size:11px;color:var(--ink);}

/* controls */
#ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;}
#ctrl[hidden]{display:none!important;}
.ctrl-l{display:flex;flex-direction:column;gap:0;font-size:11px;min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;}
#hudHeart{letter-spacing:1px;color:var(--red);}
#nextMark{font-size:14px;opacity:0;}
#nextMark.on{opacity:1;animation:blink 1.1s steps(2) infinite;}
@keyframes blink{50%{opacity:.25}}
.ctrl-r{display:flex;gap:4px;justify-content:flex-end;}
.cbtn{height:40px;min-width:40px;padding:0 6px;white-space:nowrap;flex:0 0 auto;background:var(--paper);border:2px solid var(--ink);font-size:12px;box-sizing:border-box;}
.cbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
#btnSound[aria-pressed="false"]{text-decoration:line-through;}

/* overlays */
.panel{position:absolute;inset:0;z-index:10;background:rgba(20,20,20,.35);overflow-y:auto;padding:12px;box-sizing:border-box;}
.panel[hidden]{display:none!important;}
.sheet{max-width:456px;margin:8px auto 16px;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px 16px;box-sizing:border-box;}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--ink2);}
.sheet h2{font-family:var(--f-text);font-weight:900;font-size:24px;margin:4px 0 6px;letter-spacing:.06em;text-wrap:balance;}
.sheet h3{font-family:var(--f-text);font-weight:700;font-size:14px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink);}
.sheet p.sub{margin:0;color:var(--ink2);font-size:13px;line-height:1.75;}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px;}
.slot{border:2px dashed var(--ink);padding:7px 9px;min-height:50px;text-align:left;background:#fff;box-sizing:border-box;}
.slot .lbl{display:block;font-size:10px;color:var(--ink2);}
.slot .val{display:block;font-family:var(--f-text);font-size:14px;font-weight:700;margin-top:2px;}
.slot.filled{border-style:solid;}
.slot.event{grid-column:1 / -1;border:3px solid var(--ink);background:#fff;}
.slot.event .lbl{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:3px;}
.slot.event .lbl em{font-style:normal;background:var(--red);color:#fff;padding:0 5px;margin-left:4px;}
.slot.event .val{display:block;font-weight:400;line-height:1.6;}
.slot.event .val b{font-weight:700;margin-right:6px;}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;}
.act{text-align:left;background:#fff;border:2px solid var(--ink);padding:9px 10px;display:grid;gap:3px;}
.act:not([disabled]):hover{background:#fbf8f1;}
.act.filled{background:var(--ink)!important;color:var(--paper)!important;box-shadow:inset 6px 0 0 var(--red);}
.act.filled .m{color:#d9d3c6;}
.act .cnt{float:right;font-size:11px;font-weight:700;background:var(--red);color:#fff;padding:1px 6px;}

.shr .btn{flex:1 1 auto;font-size:13px;padding:8px 10px;}
#afterglow{position:absolute;inset:0;z-index:40;background:#141414;display:grid;place-items:center;overflow:hidden;}
#afterglow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05) blur(0px);opacity:0;transform:scale(1.02);transition:opacity 1.6s ease,filter 7s ease,transform 9s ease;}
#afterglow.on img{opacity:.55;filter:grayscale(1) contrast(1.05) blur(7px);transform:scale(1.08);}
#afterglow .ag-line{position:relative;color:#f4f1ea;font-family:"Zen Old Mincho",serif;font-weight:700;font-size:clamp(20px,5vw,30px);letter-spacing:.25em;opacity:0;transition:opacity 2.4s ease 1.2s;text-shadow:0 0 18px rgba(0,0,0,.6);}
#afterglow.on .ag-line{opacity:1;}
#afterglow .ag-btn{position:absolute;bottom:12%;opacity:0;transition:opacity .8s;}
#afterglow .ag-btn.on{opacity:1;}
#afterglow .ag-note{position:absolute;bottom:6%;color:#d8d3c8;font-size:12px;letter-spacing:.12em;opacity:0;transition:opacity .8s;text-shadow:0 0 10px rgba(0,0,0,.6);}
#afterglow .ag-note.on{opacity:.85;}
#afterglow.out{opacity:0;transition:opacity .6s;}
.inv-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.inv-card{display:grid;grid-template-columns:auto auto 1fr auto;grid-template-areas:"n h . a" "g g g g";gap:6px 8px;align-items:center;padding:12px 14px;border:2.5px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);text-align:left;font:inherit;color:var(--ink);cursor:pointer;}
.inv-card:hover:not([disabled]),.inv-card:focus-visible{box-shadow:5px 5px 0 var(--red);transform:translate(-1px,-1px);}
.inv-card.done{opacity:.45;box-shadow:none;cursor:default;}
.inv-name{grid-area:n;font-weight:900;font-size:16px;}
.inv-how{grid-area:h;font-size:11px;font-weight:700;padding:1px 7px;border:1.5px solid var(--ink);}
.inv-how.mail{background:var(--ink);color:#fff;}
.inv-how.self{border-style:dashed;}
.inv-gist{grid-area:g;font-size:13.5px;line-height:1.6;}
.inv-ar,.inv-st{grid-area:a;font-size:11px;font-weight:700;color:var(--red);}
.inv-st{color:var(--ink2);}
.inv-mail{margin-top:12px;border:2px solid var(--ink);background:#fff;padding:12px 14px;}
.inv-mail .mail-body{white-space:pre-wrap;margin-top:8px;line-height:1.75;}
.dz-cta{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0 4px;padding:12px 14px;border:2.5px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s,box-shadow .12s;}
.dz-cta:hover,.dz-cta:focus-visible{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red);}
.dz-cta-ic{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:700;font-size:13px;}
.dz-cta-tx{flex:1;display:flex;flex-direction:column;gap:3px;}.dz-cta-tx b{font-size:15px;}.dz-cta-tx small{font-size:11.5px;color:var(--ink2);}
.dz-cta-ar{font-size:22px;font-weight:700;}
.t-diary{display:flex;flex-direction:column;align-items:center;gap:1px;}.t-diary small{font-size:10.5px;font-weight:400;opacity:.75;}
.dz-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.dz-item{display:grid;grid-template-columns:auto 1fr;gap:0 10px;text-align:left;background:#fff;border:2px solid var(--ink);padding:8px 10px;}
.dz-item .dz-w{grid-row:span 2;align-self:center;font-weight:700;font-size:13px;color:var(--red);min-width:3.6em;}
.dz-item .dz-t{font-family:var(--f-text);font-weight:700;font-size:14px;}
.dz-item .dz-m{font-size:11px;color:var(--ink2);}
.dz-item.miss{border-style:dashed;}
.dz-phone{background:#2a2c31;border-radius:26px 26px 20px 20px;padding:22px 12px 16px;box-shadow:inset 0 0 0 2px #44474e;}
.dz-screen{background:#f1f3ea;color:#191a17;font-size:14px;line-height:1.7;height:430px;overflow-y:auto;border-radius:4px;box-shadow:inset 0 0 0 2px #111;}
.dz-status{display:flex;justify-content:space-between;font-size:11px;padding:2px 6px;border-bottom:1px solid #9aa08e;}
.dz-bar{background:#3a4658;color:#f1f3ea;padding:3px 6px;font-size:13px;}
.dz-title{padding:6px 6px 0;font-size:15px;font-weight:700;}
.dz-meta{padding:0 6px 6px;font-size:11px;color:#555a4c;}
.dz-body{padding:8px 6px;border-top:1px dashed #9aa08e;border-bottom:1px dashed #9aa08e;white-space:pre-wrap;word-break:break-all;}
.dz-trail{padding:4px 6px 8px;font-size:12px;color:#444839;}
.dz-comment{margin:4px 6px 8px;padding:6px;border:1px solid #9aa08e;font-size:13px;}
.btn.saved{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;}
.act[disabled]{color:var(--muted);background-color:var(--paper);background-image:var(--tone);background-size:5px 5px;cursor:not-allowed;}
.act .n{font-family:var(--f-text);font-weight:700;font-size:15px;}
.act .m{font-size:11.5px;color:var(--ink2);line-height:1.5;}
.act .g{font-weight:700;}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:2px solid var(--ink);}
.proj{font-size:12px;line-height:1.6;color:var(--ink2);font-variant-numeric:tabular-nums;}
.proj b{color:var(--ink);font-weight:700;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;}
.btn{font-family:var(--f-text);font-weight:700;font-size:15px;padding:10px 16px;min-height:44px;border:3px solid var(--ink);background:var(--paper);letter-spacing:.06em;}
.btn.primary{background:var(--ink);color:var(--paper);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.small{font-size:13px;padding:6px 12px;}
.bill{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ink);}
.bill label{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;}
.bill input{width:20px;height:20px;accent-color:var(--ink);}
.bill .amt{font-weight:700;font-variant-numeric:tabular-nums;}
.bill .late{font-size:10px;color:var(--paper);background:var(--red);padding:1px 5px;margin-left:6px;}
.note{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:10px;}
.stat{display:grid;grid-template-columns:7.5em 1fr 3em;align-items:center;gap:10px;margin:7px 0;font-size:13px;}
.bar{height:8px;border:1.5px solid var(--ink);background:#fff;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--ink);}
.bar.p i{background:var(--red);}
.bar.a i{background-color:#fff;background-image:var(--toneD);background-size:4px 4px;}
.stat .v{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;}
.log{display:grid;gap:12px;max-height:60vh;overflow-y:auto;padding-right:4px;}
.log div{font-family:var(--f-text);font-size:14px;line-height:1.8;}
.log b{display:inline-block;font-family:var(--f-ui);font-weight:700;font-size:10px;background:var(--ink);color:var(--paper);padding:1px 6px;margin-right:6px;}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.two ul{margin:0;padding-left:1.2em;line-height:1.8;font-size:13px;color:var(--ink2);}

/* mail */
#mail{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(20,20,20,.4);padding:16px;}
#mail[hidden]{display:none!important;}
.phone{width:min(270px,84vw);background:#fff;border:4px solid var(--ink);border-radius:32px 32px 24px 24px;padding:16px 14px 18px;box-shadow:6px 6px 0 var(--ink);}
.phone.buzz{animation:buzz .45s linear 2;}
@keyframes buzz{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px) rotate(-.8deg)}40%{transform:translateX(3px) rotate(.8deg)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.speaker{width:46px;height:6px;border:2px solid var(--ink);border-radius:4px;margin:0 auto 12px;}
.screen{border:3px solid var(--ink);padding:0 12px 12px;font-family:var(--f-ui);font-size:14px;min-height:220px;background:#fff;}
.screen .bar2{display:flex;justify-content:space-between;font-size:11px;background:var(--ink);color:var(--paper);margin:0 -12px 10px;padding:4px 8px;}
.mail-meta{font-size:12px;border-bottom:1.5px dashed var(--ink);padding-bottom:6px;margin-bottom:8px;line-height:1.6;}
.mail-body{white-space:pre-wrap;line-height:1.7;font-family:var(--f-text);}
.keys{display:flex;justify-content:center;margin-top:14px;}
.keys button{width:110px;height:44px;border-radius:22px;background:var(--ink);color:var(--paper);border:none;font-family:var(--f-ui);font-weight:700;}

/* toasts */
#toasts{position:absolute;top:44px;right:14px;z-index:8;display:grid;gap:4px;justify-items:end;pointer-events:none;}
.toast{font-size:11.5px;font-weight:700;background:var(--ink);color:var(--paper);padding:4px 9px;animation:tin 2.6s forwards;}
.toast.pink{background:var(--red);}
.toast.bad{background:#fff;color:var(--ink);border:2px solid var(--ink);}
@keyframes tin{0%{opacity:0;transform:translateY(-4px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* title */
#title{position:absolute;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding:12px 12px calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;gap:10px;}
#title[hidden]{display:none!important;}
.t-frame{flex:1;min-height:0;}
.t-frame img{width:100%;height:100%;object-fit:cover;display:block;}
.t-title{position:absolute;right:14px;top:14px;background:var(--paper);border:3px solid var(--ink);padding:14px 10px;font-family:var(--f-text);font-weight:900;font-size:clamp(26px,4.6vh,40px);line-height:1.15;letter-spacing:.06em;margin:0;}

.t-lede{position:absolute;left:14px;bottom:14px;background:#fff;border:2px solid var(--ink);padding:12px 8px;font-family:var(--f-text);font-size:14px;line-height:1.8;max-height:60%;}
.t-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
.t-btns[hidden]{display:none!important;}
.t-btns .btn{height:62px;font-size:18px;}
.namef{display:grid;gap:8px;}
.namef[hidden]{display:none!important;}
.namef label{font-size:12px;color:var(--ink2);}

.t-about{display:flex;flex-direction:column;gap:8px;}
.t-about[hidden]{display:none!important;}
.t-catch{margin:0;font-family:var(--f-text);font-size:14px;line-height:1.6;font-weight:700;}
.t-how{margin:0;font-size:12px;line-height:1.6;color:var(--muted);}
.t-cast{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;}
.t-cast li{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;}
.t-cast img{width:100%;aspect-ratio:1/1;object-fit:cover;object-position:50% 12%;border:2px solid var(--ink);background:#fff;display:block;}
.t-cast b{font-family:var(--f-text);font-size:13px;line-height:1.2;}

#face.dark #inset{filter:brightness(.3);}
#face.dark #faceSvg{filter:brightness(.85);}

/* 早押し防止：出た直前のタップを受けない */
.arming{pointer-events:none!important;}
#choices.arming .choice{opacity:.55;}
.choice{transition:opacity .2s;}
/* 数値変化：ハンコ */
#stamp{position:absolute;left:4px;top:4px;z-index:13;pointer-events:none;opacity:0;display:flex;flex-direction:column;align-items:flex-start;}
#stamp.show{animation:stampIn 2.4s forwards;}
@keyframes stampIn{0%{opacity:0;transform:scale(1.9) rotate(-20deg)}10%{opacity:1;transform:scale(.92) rotate(-9deg)}16%{transform:scale(1) rotate(-9deg)}84%{opacity:1;transform:scale(1) rotate(-9deg)}100%{opacity:0;transform:scale(1) rotate(-9deg)}}
.st-ring{width:98px;height:98px;border-radius:50%;border:4px double var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--f-text);font-weight:900;background:rgba(255,255,255,.9);box-sizing:border-box;}
.st-ring .who{font-size:14px;letter-spacing:.1em;}
.st-ring .mark{font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums;}
.st-ring .word{font-size:10.5px;letter-spacing:.04em;}
#stamp.down .st-ring{border-color:var(--ink);color:var(--ink);}
.st-cap{margin:6px 0 0 6px;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-weight:700;font-size:11px;padding:2px 7px;font-variant-numeric:tabular-nums;transform:rotate(-3deg);}
#hudHeart{display:inline-flex;gap:6px;align-items:baseline;flex-wrap:wrap;row-gap:0;white-space:normal;}
#hudHeart .hh{white-space:nowrap;}
#hudHeart .hh .num{margin-left:3px;}
#hudHeart .num{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}
#hudHeart.pulse{animation:pulse .5s 2;}
@keyframes pulse{50%{transform:scale(1.12);}}
/* 数値変化：チップ */
#toasts{top:46px;right:auto;left:18px;justify-items:start;gap:5px;}
.toast{font-size:12.5px;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 10px;animation:tin 2.8s forwards;}
.toast.plus{background:var(--ink);color:var(--paper);}
.toast.res{background-color:#fff;background-image:var(--tone);background-size:4px 4px;}
.toast.res span{background:#fff;padding:0 3px;}
.toast.pink{background:var(--red);color:#fff;border-color:var(--red);}
/* 携帯 */
.screen{min-height:250px;display:flex;flex-direction:column;}
#pBody{flex:1;display:flex;flex-direction:column;}
.p-notify{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px 0;}
.p-notify svg{width:64px;height:48px;}
.p-big{font-weight:700;font-size:16px;letter-spacing:.06em;}
.p-from{font-size:13px;color:var(--ink2);}
.p-note{font-size:11.5px;color:var(--ink2);margin:-2px 0 8px;}

.p-item:not([disabled]):hover,.p-item:focus-visible{background:var(--ink);color:var(--paper);}
.p-item:not([disabled]):hover .p-num{background:var(--paper);color:var(--ink);}
.p-item[disabled]{color:var(--muted);background-color:#fff;background-image:var(--tone);background-size:4px 4px;cursor:not-allowed;}
.p-item[disabled] span{background:#fff;}
.p-item small{display:block;font-size:10.5px;color:var(--ink);}
.p-num{flex:0 0 auto;width:20px;height:20px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.p-compose{border:2px solid var(--ink);padding:10px;min-height:88px;font-family:var(--f-text);font-size:15px;line-height:1.7;white-space:pre-wrap;}

.p-send{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;}
.p-call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;}
.p-ring{display:flex;gap:10px;}
.p-ring i{width:12px;height:12px;border-radius:50%;background:var(--ink);opacity:.15;animation:ringd .75s infinite;}
.p-ring i:nth-child(2){animation-delay:.25s}.p-ring i:nth-child(3){animation-delay:.5s}
@keyframes ringd{40%{opacity:1}}
.p-time{font-variant-numeric:tabular-nums;font-size:22px;letter-spacing:.1em;}
.p-prog{width:80%;height:12px;border:2px solid var(--ink);}
.p-prog i{display:block;height:100%;width:0;background:var(--ink);animation:prog .85s linear forwards;}
@keyframes prog{to{width:100%}}
.keys{gap:10px;}
.keys button{width:auto;min-width:96px;padding:0 16px;background:#fff;color:var(--ink);border:3px solid var(--ink);}
.keys button.primary{background:var(--ink);color:var(--paper);}

#stage img{-webkit-user-drag:none;pointer-events:none;}
.sumrow{display:grid;grid-template-columns:6.5em 1fr;gap:4px 10px;align-items:center;margin:9px 0;font-size:13px;}
.sumrow .lab{font-weight:700;}
.sumrow .val{grid-column:2;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;}
.sumrow .val b{color:var(--ink);}
.dbar{position:relative;height:12px;border:1.5px solid var(--ink);background:#fff;overflow:hidden;}
.dbar i{position:absolute;top:0;bottom:0;}
.dbar .base{left:0;background:var(--ink);}
.dbar .gain{background:var(--red);}
.dbar .loss{background-color:#fff;background-image:repeating-linear-gradient(135deg,var(--ink) 0 1.5px,transparent 1.5px 5px);}

.hints{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px;}

.hints li::before{content:"――";letter-spacing:-.1em;margin-right:.3em;color:var(--muted);}
#black{position:absolute;inset:0;z-index:20;background:#0b0b0b;color:#efeae0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.8s ease;pointer-events:none;}
#black.on{opacity:1;pointer-events:auto;}
#blackText{font-family:var(--f-text);font-size:19px;line-height:2.3;letter-spacing:.28em;max-height:80%;}
.endlist{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none;}
.endlist li{font-family:var(--f-text);font-size:14px;border:2px solid var(--ink);padding:6px 10px;background:#fff;}
.endlist li.no{color:var(--muted);border-style:dashed;background:transparent;}
.endlist li.now{background:var(--ink);color:var(--paper);}
.epi{font-family:var(--f-text);font-size:15px;line-height:1.9;margin:10px 0 0;}
/* 一枚絵：いつものコマ割りをやめて、大ゴマ・斜めゴマ・アップで見せる */
#still{position:relative;flex:1;min-height:0;display:none;}
#stage.still #p1,#stage.still #face{display:none;}
#stage.still #still{display:block;}
#stage.still #p2{flex:0 0 31%;}
#stage.still #txt.say #bubble{border-radius:36px;padding:14px 22px;}
#stage.still #txt.me #bubble{padding:12px 16px;}
#still svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
#still .stp{animation:stIn .55s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center;}
@keyframes stIn{from{opacity:0;transform:translateY(14px) scale(1.02)}to{opacity:1;transform:none}}
#still .st-cap{position:absolute;top:10px;right:10px;background:#fff;color:var(--ink);border:2px solid var(--ink);padding:10px 7px;font-family:var(--f-text);font-size:14px;line-height:1.7;letter-spacing:.12em;max-height:calc(100% - 20px);animation:stIn .6s .35s both;}
#still .st-cap.l{right:auto;left:10px;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}#stamp.show{opacity:1;}}
</style>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rint = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SAVE_KEY = 'hitorigoto-save-v1';
const LAST_WEEK = 49;

const RES = { music: '音楽', film: '映画', manga: '漫画', lit: '文学', mono: '服とモノ' };
const CHARS = {
  akari: { name: '鈴' }, tencho: { name: '店長' }, go: { name: '剛' }, mido: { name: '御堂' },
  kazu: { name: 'カズ' }, mika: { name: 'ミカ' },
  shiori: { name: '愛' }, kuga: { name: '久我' }, maho: { name: '真帆' },
  michiru: { name: '由里' }, mcFather: { name: '由里の父' }, jouren: { name: '常連さん' },
  nemu: { name: 'ねむ' }, chikage: { name: '千景' },
  rei: { name: '玲子' }, misaki: { name: '美咲' }, machiko: { name: '真知子' }
};
const PORTRAITS = new Set(['akari', 'tencho', 'go', 'mido', 'shiori', 'kuga', 'maho', 'michiru', 'nemu', 'chikage', 'rei', 'misaki', 'machiko']);
// ルートを持つヒロイン
const HEROINES = {
  akari: { name: '鈴', met: 'akariMet', rival: 'go' },
  shiori: { name: '愛', met: 'shioriMet', rival: 'mido' },
  michiru: { name: '由里', met: 'michiruMet', rival: 'mido' },
  nemu: { name: 'ねむ', met: 'nemuMet', rival: 'chikage' },
  rei: { name: '玲子', met: 'reiMet', rival: 'mido' },
  tencho: { name: '店長', met: 'tenchoMet', rival: 'mido' }
};
const COMMON_LAST = 17;
const LIFE_LABEL = { elec: '電気', gas: 'ガス', water: '水道', phone: '携帯' };
const LIFE_LIMIT = { elec: 3, gas: 4, water: 8, phone: 6 };

/* ---------------- state ---------------- */
// 名前ごとに、はじめの解像度が少しだけ違う（同じ名前なら毎回同じ）
function nameRes(name) {
  let h = 2166136261; for (const c of (name || '湊')) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const r = seeded(h % 2147483646 + 1); r(); r();
  const j = (base, lo, hi) => base + Math.floor(lo + r() * (hi - lo + 1));
  return { music: j(30, -3, 7), film: j(20, -3, 7), manga: j(20, -3, 5), lit: j(20, -3, 5), mono: j(25, -3, 5) };
}
function newState(name) {
  return {
    name: name || '湊', week: 1, money: 38000,
    res: nameRes(name),
    snob: 10, mie: 0, noume: 0, risk: 0, room: 10,
    aff: { akari: 5, tencho: 5, shiori: 5, michiru: 5, nemu: 5, rei: 5 }, honne: { akari: 0, shiori: 0, michiru: 0, nemu: 0, rei: 0 }, akogare: { akari: 0, shiori: 0, michiru: 0, nemu: 0, rei: 0 },
    rival: { go: { akari: 0, shiori: 0, michiru: 0, nemu: 0 }, mido: { akari: 0, shiori: 0, michiru: 0, rei: 0 }, chikage: { nemu: 0 } },
    route: null, picks: { akari: 0, shiori: 0, michiru: 0, nemu: 0, rei: 0 },
    bills: [], off: { elec: false, gas: false, water: false, phone: false }, newOff: [],
    loan: null, tired: 0, ownLoveless: false, ownPopeye: 0, ending: null,
    flags: {}, seen: {}, prologueDone: false
  };
}
let S = newState();
let LOG = [];

// 好感度の上がり方：週が進むほど、今の値が高いほど鈍る。小さな上がり幅は確率で丸める。
// 下がるほうは、そのまま下がる。
const AFF_K = { early: .8, late: .48, top: 150 };
// 狙った相手（ルートに入った相手）は、上がりやすさの補正を受ける。狙えば100に届くように
const ROUTE_BOOST = { akari: 0.7, shiori: 0.8, nemu: 0.95, rei: 1.0, michiru: 1.3, tencho: 1.3 };
const ROUTE_TOP = 400;
function gainScale(n, before, ch) {
  const onRoute = ch && S.route === ch && S.week > 6;
  const x = n * (S.week <= 6 ? AFF_K.early : AFF_K.late) * (onRoute ? (ROUTE_BOOST[ch] || 1) : 1) * (1 - before / (onRoute ? ROUTE_TOP : AFF_K.top));
  if (n >= 4) return Math.max(1, Math.round(x));
  return Math.floor(x + Math.random());
}
function aff(ch, n) {
  const before = S.aff[ch];
  if (S._noPen && n < 0) return;
  if (n > 0) n = gainScale(n, before, ch);
  // 下がるほうも、第七週からは少しだけ鈍らせる（ただし必ず1は下がる）
  else if (n < 0 && S.week > 6) n = Math.min(-1, Math.round(n * .7));
  S.aff[ch] = clamp(before + n, 0, window.__affMax || 100); // __affMax：検証用（本番では100）
  if (HEROINES[ch] && S.aff[ch] !== before) stampAff(HEROINES[ch].name, before, S.aff[ch]);
  updateHUD();
}
function snob(n) { S.snob = clamp(S.snob + n, 0, 100); }
function honne(ch, n) { S.honne[ch] = clamp((S.honne[ch] || 0) + n, 0, 3); }
// 「こうありたい自分」を肯定した段階（本音度と並ぶTrueの条件）
function akogare(ch, n) { S.akogare[ch] = clamp((S.akogare[ch] || 0) + n, 0, 3); }
// 好感度MAXエンド（各ヒロイン1本）。トゥルーの条件に、好感度がこの値以上、を足したもの
const FULL_AFF = 100;
const akariEndKey = s => s.flags.lost ? 'rival'
  : (s.aff.akari >= FULL_AFF && s.honne.akari >= 3 && s.akogare.akari >= 3 && s.flags.overcome) ? 'akFull'
  : (s.aff.akari >= 80 && s.honne.akari >= 3 && s.akogare.akari >= 3 && s.flags.overcome) ? 'true'
  : s.aff.akari >= 60 ? (s.honne.akari > s.akogare.akari ? 'akHonne' : s.akogare.akari > s.honne.akari ? 'akAko' : 'normal')
  : 'friend';
function rival(who, ch, n) { if (n > 0) n = Math.floor(n * (S.week <= 6 ? .8 : .55) + Math.random()); S.rival[who][ch] = clamp(S.rival[who][ch] + n, 0, 100); }
function res(k, n) { const b = S.res[k]; S.res[k] = clamp(b + n, 0, 100); if (S.res[k] !== b) toast(`<span>${RES[k]}の解像度　${b} → ${S.res[k]}</span>`, 'res', true); }
function money(n, label) {
  const b = S.money;
  S.money = Math.max(0, S.money + n);
  const d = S.money - b;
  if (d) { toast(`${label ? label + '　' : ''}${d > 0 ? '＋' : '−'}${yen(Math.abs(d))}`, d > 0 ? 'plus' : ''); if (d > 0) Sound.sfx('coin'); }
  updateHUD();
}

/* ---------------- akari renderer ---------------- */
// 鈴（すず）立ち絵レンダラー：同じ骨格を4つの画風で描き分ける

async function run(cmds) {
  for (const c of cmds) {
    if (typeof c === 'function') { const r = c(S); if (Array.isArray(r) && (await run(r)) === 'stop') return 'stop'; continue; }
    if (c.stop) return 'stop';
    if (c.bg) { setScene(c.bg); await imgWait($('#bgImg').getAttribute('src')); }
    if (c.bgm) Sound.play(c.bgm);
    if (c.still !== undefined) { if (c.still && !(c.still.art && STILL_PENDING.has(c.still.art))) { setSkip(false); await showStill(c.still); } else if (!c.still) hideStill(); }
    if (c.show) { showChar(c.show, c.e || 'normal'); await imgWait(charSrc(c.show, c.e || 'normal')); }
    if (c.hide) hideChar();
    if (c.fx) { c.fx(S); updateHUD(); }
    if (c.nar) await line(null, c.nar);
    if (c.say) {
      if (!c.off && PORTRAITS.has(c.say)) {
        const e = c.e || (cur.char === c.say ? cur.expr : 'normal');
        if (cur.char !== c.say || cur.expr !== e) { showChar(c.say, e); await imgWait(charSrc(c.say, e)); }
      } else if (!c.off && !PORTRAITS.has(c.say) && cur.char) hideChar();
      await line(CHARS[c.say].name, c.t);
    }
    if (c.choice) {
      const pickd = await choose(c.choice);
      if (!pickd.silent) await line(S.name, pickd.text, 'me');
      if (pickd.go && (await run(pickd.go)) === 'stop') return 'stop';
    }
    if (c.mail && S.off.phone) {
      await line(null, pick(['携帯は止まったままだ。誰かのメールが、どこかで止まっている。', '携帯を開いても、何も届いていない。止めたのは、自分だった。']));
      if (c.mail.ignore && (await run(c.mail.ignore)) === 'stop') return 'stop';
    } else if (c.mail && S._skipInviteMail && S._invKey && c.mail.from + '|' + c.mail.subj === S._invKey) {
      S._skipInviteMail = null; S._invKey = null;
      if (c.mail.replies) { // 選択画面で読んだメール。「断る」返事は選べない（もう行くと決めている）
        const okR = c.mail.replies.filter(r => !(r.go && r.go.some(g => g && g.stop)));
        const r = await showMail(Object.assign({}, c.mail, { replies: okR, __seen: true }));
        if (r && r.go && (await run(r.go)) === 'stop') return 'stop';
      } else LOG.push({ name: '受信メール：' + c.mail.from, text: interp(c.mail.body) });
    } else if (c.mail) {
      const r = await showMail(c.mail);
      if (r) { if (r.go && (await run(r.go)) === 'stop') return 'stop'; }
      else if (c.mail.ignore && (await run(c.mail.ignore)) === 'stop') return 'stop';
    }
    if (c.wait) await sleep(c.wait);
    if (c.black !== undefined) { hideStill(); await blackCard(c.black, c.hold); }
    if (c.unblack) { $('#black').classList.remove('on'); await sleep(reduced ? 0 : 1600); }
  }
}

// テキストプール：同じ週の中でも、同じ行動の文章が続けて出ないように、一巡するまで使った行を避ける。
// 各行は { t: 本文, fx?: 追加効果, when?: 出る条件, once?: 一度きりの登場 }。
const early = s => s.week <= 2, gw = s => s.week === 3 || s.week === 4, may = s => s.week >= 5 && s.week <= 8;
const rainy = s => s.week >= 9 && s.week <= 14, summer = s => s.week >= 13 && s.week <= 24, autumn = s => s.week >= 25 && s.week <= 36, winter = s => s.week >= 36;
function fresh(id, pool) {
  S.seen = S.seen || {};
  const used = S.seen[id] || [];
  const ok = pool.filter(p => (!p.when || p.when(S)) && !(p.once && (S.flags['once_' + p.once] || (HEROINES[p.once] && S.flags[HEROINES[p.once].met]))));
  if (!ok.length) return pool.find(p => !p.when) || pool[0];
  let cands = ok.filter(p => !used.includes(p.t));
  if (!cands.length) { S.seen[id] = []; cands = ok; }
  const onces = cands.filter(p => p.once);
  const p = (onces.length && Math.random() < .5) ? pick(onces) : pick(cands);
  S.seen[id] = [...(S.seen[id] || []), p.t];
  if (p.once) S.flags['once_' + p.once] = true;
  return p;
}
function lineOf(p) { return [...(p.bg ? [{ bg: p.bg }] : []), N(p.t), ...(p.fx ? [FX(p.fx)] : [])]; }

function schedule() {

        if (i >= nWd) { slots.push(`<div class="slot"><span class="lbl">平日 ${i + 1}</span><span class="val" style="color:var(--muted);font-weight:400">${tired >= 2 ? '腰が痛くて寝ている' : '筋肉痛で動けない'}</span></div>`); continue; }
        const id = wd[i]; const act = ACTIONS.find(x => x.id === id);
        slots.push(`<button type="button" class="slot ${id ? 'filled' : ''}" data-rm="${i}"><span class="lbl">平日 ${i + 1}${id ? '　×' : ''}</span><span class="val">${act ? act.n : '—'}</span></button>`);
      }
      const weAct = ACTIONS.find(x => x.id === weSel.v);
      slots.push(`<button type="button" class="slot ${weAct ? 'filled' : ''}" data-rmwe="1"><span class="lbl">週末の昼${weAct ? '　×' : ''}</span><span class="val">${weAct ? weAct.n : '—'}</span></button>`);
      const nEv = weekEvents(S.week).length;
      slots.push(`<div class="slot event"><span class="lbl">${nEv > 1 && S.week > 1 ? `週末の夜<em>${KN(nEv)}つのうち、いずれか</em>` : '週末の夜'}</span><span class="val">${eventTitle(S.week)}</span></div>`);
      const card = x => {
        const ok = !x.need || x.need(S);
        const full = x.when === 'wd' ? wd.length >= nWd : false;
        const cnt = wd.filter(v => v === x.id).length;
        return `<button type="button" class="act ${cnt ? 'filled' : ''}" data-act="${x.id}" ${!ok || (full && !cnt) ? 'disabled' : ''}><span class="n">${x.n}${cnt ? `<span class="cnt">${cnt > 1 ? '×' + cnt : '選択中'}</span>` : ''}</span><span class="m">${ok ? mOf(x) : (x.offMsg ? x.offMsg(S) : '条件：' + x.needLabel)}</span></button>`;
      };
      const ready = wd.length === nWd && weSel.v;
      const wasReady = schedule.wasReady; schedule.wasReady = !!ready;
      openPanel(`<div class="sheet" role="dialog" aria-label="今週の予定">
        <div class="eyebrow">${[...String(a.getUTCFullYear())].map(d => KD[+d]).join('')}年　${KN(a.getUTCMonth() + 1)}月${KN(a.getUTCDate())}日（月）〜${KN(b.getUTCMonth() + 1)}月${KN(b.getUTCDate())}日（日）</div>
        <h2>今週の予定</h2>
        <p class="sub">${nWd ? `平日${nWd}コマと` : ''}週末の昼1コマを決める。${weekEvents(S.week).length > 1 && S.week > 1 ? `週末の夜は、約束が${KN(weekEvents(S.week).length)}つ重なっている。` : weekEvents(S.week).length ? '週末の夜には約束がある。' : '週末の夜は、まだ何も決まっていない。'}${tired ? `<br>先週、引っ越しバイトを${S.tired}回入れた疲れで、平日が${tired}コマ減っている。` : ''}</p>
        <div class="slots">${slots.join('')}</div>
        <h3>平日にすること</h3>
        <div class="acts">${ACTIONS.filter(x => x.when === 'wd' && !(x.hide && x.hide(S))).map(card).join('')}</div>
        <h3>週末の昼にすること</h3>
        <div class="acts">${ACTIONS.filter(x => x.when === 'we' && !(x.hide && x.hide(S))).sort((a, b) => WE_ORDER.indexOf(a.id) - WE_ORDER.indexOf(b.id)).map(x => { const ok = !x.need || x.need(S); return `<button type="button" class="act ${weSel.v === x.id ? 'filled' : ''}" data-we="${x.id}" ${!ok ? 'disabled' : ''}><span class="n">${x.n}${weSel.v === x.id ? '<span class="cnt">選択中</span>' : ''}</span><span class="m">${ok ? mOf(x) : (x.offMsg ? x.offMsg(S) : '条件：' + x.needLabel)}</span></button>`; }).join('')}</div>

function bills() {
  return new Promise(resolve => {
    let running = 0, loanNow = false; const picked = new Set();
    S.bills.forEach((x, i) => { if (running + x.amount <= S.money) { running += x.amount; picked.add(i); } });
    const render = () => {
      const total = [...picked].reduce((s, i) => s + S.bills[i].amount, 0);
      const over = total > S.money;
      openPanel(`<div class="sheet" role="dialog" aria-label="今週の支払い">
        <div class="eyebrow">第${KN(S.week)}週の終わり</div>
        <h2>支払い</h2>

        <div style="margin-top:12px">
          ${S.bills.map((x, i) => `<div class="bill"><label><input type="checkbox" id="bill${i}" data-i="${i}" ${picked.has(i) ? 'checked' : ''}>${x.label}${x.weeks > 0 ? `<span class="late">${x.weeks}週滞納</span>` : ''}</label><span class="amt">${yen(x.amount)}</span></div>`).join('') || '<p class="note">今週の請求はない。</p>'}
        </div>
        <div class="foot">
          <div class="proj">所持金 <b>${yen(S.money)}</b> → 支払い後 <b style="color:${over ? 'var(--red)' : 'var(--ink)'}">${yen(S.money - total)}</b>${over ? '<br>お金が足りない' : ''}</div>
          <div class="btnrow">${S.loan ? (loanNow ? '<button type="button" class="btn small" id="btnUnloan">やっぱり借りない</button>' : '') : '<button type="button" class="btn small" id="btnLoan">学生ローンで10万円借りる</button>'}<button type="button" class="btn primary" id="btnPay" ${over ? 'disabled' : ''}>これで決める</button></div>
        </div>
        ${S.loan ? `<p class="note">学生ローン残高 ${yen(S.loan.balance)}。毎週 ${yen(S.loan.weekly)} を返済中。</p>` : `<p class="note">学生ローンは十万円借りて、三月までに十一万円を返す。今借りると毎週 ${yen(loanWeekly(110000))} の返済。3回延滞すると取り返しがつかなくなる。</p>`}
      </div>`);
      panel.querySelectorAll('input[data-i]').forEach(el => el.addEventListener('change', () => { const i = +el.dataset.i; el.checked ? picked.add(i) : picked.delete(i); render(); }));
      const lb = $('#btnLoan'); if (lb) lb.addEventListener('click', () => { S.loan = { balance: 110000, weekly: loanWeekly(110000), missed: 0 }; loanNow = true; money(100000, '学生ローン'); render(); });
      const ub = $('#btnUnloan'); if (ub) ub.addEventListener('click', () => { S.loan = null; loanNow = false; S.money -= 100000; updateHUD(); render(); });
      $('#btnPay').addEventListener('click', () => {
        const paidKinds = new Set();
        const keep = [];
        S.bills.forEach((x, i) => { if (picked.has(i)) { S.money -= x.amount; paidKinds.add(x.kind); } else keep.push(x); });
        S.bills = keep;
        closePanel(); updateHUD(); resolve(paidKinds);
      });
    };
    render();
  });
}

// 学生ローン：三月末（最終週）までに返し終わる額。遅く借りるほど、一回の返済が重くなる
function loanWeekly(bal) { const left = Math.max(1, LAST_WEEK - S.week); return Math.max(4000, Math.ceil(bal / left / 1000) * 1000); }

/* ---------------- save ---------------- */
// セーブは、公開ページでは遊ぶ人ごとのクラウド保存（db の data/users/<id>/）に置く。
// 使えない環境（ファイルで開いたとき・閲覧のみの共有など）では、これまでどおりブラウザに保存する。
const Cloud = { db: null, uid: null, save: null, endings: [] };
Cloud.ready = (async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) return;
    const [sv, en] = await Promise.all([db.doc('data/users/' + uid + '/save').get(), db.doc('data/users/' + uid + '/endings').get()]);
    Cloud.db = db; Cloud.uid = uid;
    if (sv.exists && sv.data().s) { try { Cloud.save = JSON.parse(sv.data().s); } catch (e) { } }
    if (en.exists && Array.isArray(en.data().list)) Cloud.endings = en.data().list;
  } catch (e) { Cloud.db = null; }
})();
function cloudPut(name, body) { if (!Cloud.db) return false; Cloud.db.doc('data/users/' + Cloud.uid + '/' + name).set(body).catch(() => { }); return true; }
function save() {
  S._at = Date.now();
  let ok = false;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); ok = true; } catch (e) { }
  if (Cloud.db) { Cloud.save = JSON.parse(JSON.stringify(S)); ok = cloudPut('save', { s: JSON.stringify(S), at: S._at }) || ok; }
  return ok;
}
function loadSave() {
  let local = null; try { const r = localStorage.getItem(SAVE_KEY); local = r ? JSON.parse(r) : null; } catch (e) { }
  const c = Cloud.save;
  if (local && c) return (c._at || 0) > (local._at || 0) ? c : local;
  return local || c || null;
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } Cloud.save = null; cloudPut('save', { s: '', at: Date.now() }); }

const MONTHS = w => KN(weekStart(w).getUTCMonth() + 1) + '月';
function billsFor(w) {
  const out = [];
  if ((w - 1) % 4 === 0) {
    const winter = w >= 32 || w <= 2;
    out.push({ kind: 'elec', label: `電気（${MONTHS(w)}分）`, amount: w >= 13 && w <= 24 ? 5800 : w >= 36 || w <= 2 ? 4600 : 4000 });
    out.push({ kind: 'gas', label: `ガス（${MONTHS(w)}分）`, amount: winter ? 6000 : 4000 });
  }
  if ((w - 1) % 8 === 0) out.push({ kind: 'water', label: '水道（2か月分）', amount: 4000 });
  if (w >= 2 && (w - 2) % 4 === 0) out.push({ kind: 'phone', label: `携帯（${MONTHS(w)}分）`, amount: 7200 });
  if (w % 4 === 0) out.push({ kind: 'rent', label: `家賃（${MONTHS(w + 1)}分）`, amount: 52000 });
  return out;
}

const EV_OF = { akari: () => EVENTS, shiori: () => SHIORI_EV, michiru: () => MICHIRU_EV, nemu: () => NEMU_EV, rei: () => REI_EV, tencho: TC_EV };
function evOf(h, w) { return EV_OF[h]()[w] || null; }
function titleOf(e) { return typeof e.title === 'function' ? e.title(S) : e.title; }
function weekEvents(w) {
  if (w <= COMMON_LAST) return Object.keys(HEROINES).filter(h => evOf(h, w) && (w === 1 || h === 'akari' || S.flags[HEROINES[h].met]));
  const r = S.route || 'akari';
  return evOf(r, w) ? [r] : [];
}
function eventTitle(w) {
  const hs = weekEvents(w);
  if (!hs.length) return 'なりゆき';
  if (hs.length > 1 && w > 1) return hs.map(h => `<b>${HEROINES[h].name}</b>${titleOf(evOf(h, w))}`).join('<br>');
  return hs.map(h => titleOf(evOf(h, w))).join('<br>');
}

// 週末の夜の約束が重なったとき、選択画面に出す概説。how: mail=メール／talk=直接／self=自分から
const INVITE = {
  akari: { 2: ['mail', 'スタジオのあと、機材の搬出を手伝う'], 3: ['mail', '夜の公園で、缶ビールを飲む'], 4: ['mail', '鈴のバンドのリハを見に行く'], 6: ['mail', 'ハイムのライブ。ミカが辞めるらしい'],
    7: ['talk', 'バンドの最後のリハに顔を出す'], 8: ['mail', 'ライブのフライヤーを作る', '制作にとりかかる'], 10: ['mail', 'はやぶさの帰還を、公園で見る'], 12: ['self', 'ハレーションの最後のハイム'],
    13: ['self', '円盤堂のカウンターに立つ土曜'], 14: ['talk', '夜の公園。鈴に呼ばれている'], 15: ['mail', '御堂から、誘いを受けている'], 16: ['mail', 'カラオケに誘われている'], 17: ['talk', '宵町川の花火。鈴たちと見る'] },
  shiori: { 2: ['self', '日曜、キネマの売店で「二番館」を買う'], 3: ['self', '日曜の午後、キネマへ'], 8: ['mail', '池袋のオールナイト。清順の三本立て'], 9: ['self', '土曜の昼、キネマで『告白』の初日'],
    11: ['talk', '早稲田の名画座。北野武の二本立て'], 13: ['self', '雨の土曜の夜、閉館後のキネマ'], 14: ['talk', '愛が書いた脚本を、読ませてもらう'], 15: ['self', '土曜の午後、キネマの売店へ'], 17: ['mail', '河川敷の撮影。エキストラをひとり探している'] },
  michiru: { 9: ['talk', 'さぼてんで、由里の現像したベタ焼きを見る'], 10: ['mail', '子ども写真館の「あやし役」。日給三千円'], 11: ['mail', '閉店する喫茶ローレルを、撮りに行く'], 13: ['mail', 'レンタル暗室で、焼くところを見学する'],
    14: ['self', '土曜の昼、さぼてんへ'], 15: ['self', '土曜の昼、さぼてんの窓ぎわへ'], 17: ['mail', '宵町川の花火を撮る。黒い紙を持つ係'] },
  nemu: { 6: ['self', '眠れない土曜の夜。古書通りの窓が明るい'], 8: ['mail', '美大の彫刻科の作業場を、見学する'], 9: ['mail', '駅前のファミレスで、ねむのネームを見る'], 11: ['mail', '夏コミの当落と、売り子の相談'],
    14: ['mail', 'ミニコミの店に、本を置いてもらいに行く'], 16: ['mail', '入稿前のベタ塗りを手伝う'] },
  rei: { 7: ['self', '日曜の朝、向かいの古着屋の前を通る'], 10: ['mail', '玲子の部屋で、裾の長さを見る'], 12: ['self', '土曜の午後、古着屋「マチコ」へ'], 15: ['self', '土曜の夕方、古着屋「マチコ」へ'],
    16: ['mail', '日暮里の生地屋の街で、荷物持ち'], 17: ['mail', '宵町川の花火。玲子と行く'] }
};
const MAIL_FLAG = { akari: 'akariMail', shiori: 'shioriMail', michiru: 'michiruMail', nemu: 'nemuMail', rei: 'reiMail' };
function inviteText(h, w) {
  const iv = (INVITE[h] || {})[w];
  if (!iv) return titleOf(evOf(h, w));
  let how = iv[0];
  if (how === 'mail' && !S.flags[MAIL_FLAG[h]]) how = 'talk';
  return '【' + { mail: 'メール', talk: '直接', self: '自分から' }[how] + '】' + iv[1];
}
const CONFLICT_LINES = n => [`週末の夜の予定が、${KN(n)}つ重なった。`, `誘いが${KN(n)}つ、同じ夜に重なった。`, '土曜の夜は、ひとつしかない。'];
async function playWeekend() {
  setSkip(false); // 週末の夜の予定が始まったら、スキップはここで止まる
  if (S.flags.tcFarewell === S.week && TC_FAREWELL[S.flags.tcFrom]) { const m = TC_FAREWELL[S.flags.tcFrom]; await run([{ bg: S.off.elec ? 'roomDark' : 'room', bgm: 'night' }, { mail: Object.assign({ time: '21:40' }, m) }]); hideChar(); }
  if (S.flags.tcReady && !S.flags.tcAsked && S.route && S.route !== 'tencho' && S.week <= 40) {
    S.flags.tcReady = false;
    await run(tenchoMail(S)); hideStill(); hideChar();
    if (S.route === 'tencho') { (S.dl = S.dl || []).push({ w: S.week, h: 'tencho', k: 'go', n: 1 }); return; }
  }
  const w = S.week, hs = weekEvents(w);
  if (!hs.length) { await run(nightFiller()); return; }
  if (w === 1) { for (const h of hs) { await run(evOf(h, 1).script); hideStill(); hideChar(); } return; }
  let h = hs[0], ans = {};
  if (hs.length > 1) {
    await run([{ hide: true }, s => [{ bg: s.off.elec ? 'roomDark' : 'room', bgm: 'room' }], N(pick(CONFLICT_LINES(hs.length)))]);
    const r = await inviteBoard(hs, w); h = r.pick; ans = r.ans;
    S.flags['cp_' + h] = (S.flags['cp_' + h] || 0) + 1;
    S._skipInviteMail = h; // 誘いのメールは選択画面で読んだので、本編では受信の演出を出さない
    { const im = inviteMail(h, w); S._invKey = im ? im.from + '|' + im.subj : null; }
  }
  S.picks[h] = (S.picks[h] || 0) + 1;
  (S.dl = S.dl || []).push({ w, h, k: 'go', n: hs.length });
  for (const o of hs) if (o !== h) S.dl.push({ w, h: o, k: 'miss', to: h, n: hs.length });
  await run(evOf(h, w).script);
  S._skipInviteMail = null;
  for (const o of hs) if (o !== h) {
    hideStill(); hideChar();
    if (ans[o] === 'noreply') aff(o, -1);
    const m = MISS[o] && MISS[o][w];
    const selfInv = ((INVITE[o] || {})[w] || [])[0] === 'self';
    if (selfInv) S._noPen = true; // 誘われていない予定を選ばなかっただけでは、評価は下がらない
    if (m) await run(ans[o] === 'noreply' ? prefixMail(m, '返事、なかったね\n\n……べつにいいけど\n\n') : m);
    S._noPen = false;
  }
}
// 誘いのメール（イベントの冒頭で届くもの）を取り出す。選択画面で本文を見せるため
function inviteMail(h, w) {
  const ev = evOf(h, w); if (!ev) return null;
  const look = (cmds, depth) => {
    for (const c of cmds.slice(0, 5)) {
      let r = c; if (typeof c === 'function') { try { r = c(S); } catch (_) { r = null; } }
      if (Array.isArray(r)) { if (depth < 2) { const f = look(r, depth + 1); if (f) return f; } continue; }
      if (r && r.mail) return r.mail;
      if (r && (r.show || r.say)) return null; // 登場人物が出たら、それ以降は誘いではない
    }
    return null;
  };
  return look(ev.script, 0);
}
// 返事をしなかった相手の、その夜のメールの頭に一言を足す
function prefixMail(cmds, pre) {
  const map = c => {
    if (typeof c === 'function') return s => { const r = c(s); return Array.isArray(r) ? r.map(map) : r; };
    if (c && c.mail && !c.mail.__pre) return Object.assign({}, c, { mail: Object.assign({}, c.mail, { body: pre + c.mail.body, __pre: true }) });
    return c;
  };
  return cmds.map(map);
}
// 週末の夜の誘いが重なったとき：誘いを一枚ずつ開いて、行く／断る／保留を決める
function inviteBoard(hs, w) {
  return new Promise(resolve => {
    const ans = {}; // h -> 'declined' | 'noreply'
    const how = h => { const iv = (INVITE[h] || {})[w]; let k = iv ? iv[0] : 'talk'; if (k === 'mail' && !S.flags[MAIL_FLAG[h]]) k = 'talk'; if (k === 'mail' && !inviteMail(h, w)) k = 'talk'; return k; };
    const gist = h => { const iv = (INVITE[h] || {})[w]; return iv ? iv[1] : titleOf(evOf(h, w)); };
    const HOW = { mail: 'メール', talk: '直接', self: '自分から' };
    const list = () => {
      const open = hs.filter(h => !ans[h]);
      openPanel(`<div class="sheet inv" role="dialog" aria-label="週末の夜">
        <div class="eyebrow">第${KN(w)}週　土曜の夜</div>
        <h2>週末の夜</h2>
        <p class="sub">誘いが${KN(hs.length)}つ、同じ夜に重なった。一つずつ開いて、どこへ行くか決める。</p>
        <div class="inv-list">${hs.map(h => `<button type="button" class="inv-card ${ans[h] ? 'done' : ''}" data-h="${h}" data-tag="${HEROINES[h].name}" ${ans[h] ? 'disabled' : ''}>
          <span class="inv-name">${HEROINES[h].name}</span><span class="inv-how ${how(h)}">${HOW[how(h)]}</span>
          <span class="inv-gist">${esc(gist(h))}</span>${ans[h] ? '<span class="inv-st">断った</span>' : '<span class="inv-ar">開く</span>'}</button>`).join('')}</div>
        <div class="foot"><span class="proj">${open.length > 1 ? '選ばなかった誘いの扱いは、行き先を決めたあとで聞かれる' : '残りは一つ'}</span><span></span></div>
      </div>`);
      panel.querySelectorAll('.inv-card:not([disabled])').forEach(b => b.addEventListener('click', () => { Sound.sfx('key'); detail(b.dataset.h); }));
    };
    const goLabel = (h, k, m) => { const iv = (INVITE[h] || {})[w]; if (iv && iv[2]) return iv[2]; return k === 'mail' ? (m && m.replies ? '行く、と返信する' : '行く') : k === 'self' ? '行く' : '行く、と答える'; };
    const detail = h => {
      const k = how(h), m = k === 'mail' ? inviteMail(h, w) : null, open = hs.filter(x => !ans[x]);
      const canDecline = open.length > 1;
      openPanel(`<div class="sheet inv" role="dialog" aria-label="誘いの内容">
        <div class="eyebrow">${HOW[k]}　${HEROINES[h].name}</div>
        ${m ? `<div class="inv-mail"><div class="mail-meta">From：${esc(m.from)}<br>Sub：${esc(m.subj || '(無題)')}</div><div class="mail-body">${esc(interp(m.body))}</div></div>`
            : `<h2>${esc(gist(h))}</h2><p class="sub">${k === 'self' ? '誰かに誘われたわけではない。行こうと思えば、行ける。' : 'バイトの帰りに、直接、声をかけられていた。'}</p>`}
        <div class="foot"><div class="btnrow">
          <button type="button" class="btn small" data-act="back">${k === 'mail' ? '保留する' : '戻る'}</button>
          ${canDecline && k !== 'self' ? `<button type="button" class="btn small" data-act="decline">${k === 'mail' ? '断りの返信をする' : '断る'}</button>` : ''}
          <button type="button" class="btn primary" data-act="go">${goLabel(h, k, m)}</button>
        </div></div>
      </div>`);
      panel.querySelector('[data-act="back"]').addEventListener('click', list);
      const dc = panel.querySelector('[data-act="decline"]'); if (dc) dc.addEventListener('click', () => { ans[h] = 'declined'; Sound.sfx('send'); list(); });
      panel.querySelector('[data-act="go"]').addEventListener('click', () => { Sound.sfx('select'); after(h); });
    };
    const after = h => {
      const rest = hs.filter(x => x !== h && !ans[x] && how(x) === 'mail');
      hs.filter(x => x !== h && !ans[x] && how(x) !== 'mail').forEach(x => { ans[x] = 'declined'; });
      if (!rest.length) { closePanel(); resolve({ pick: h, ans }); return; }
      openPanel(`<div class="sheet inv" role="dialog" aria-label="残りの誘い">
        <div class="eyebrow">${HEROINES[h].name}のほうへ行く</div>
        <h2>残りのメールは、どうする</h2>
        <p class="sub">${rest.map(x => HEROINES[x].name).join('と、')}からのメールに、まだ返事をしていない。</p>
        <div class="foot"><div class="btnrow"><button type="button" class="btn small" data-act="noreply">返信しない</button><button type="button" class="btn primary" data-act="sendall">断りの返信を送る</button></div></div>
      </div>`);
      panel.querySelector('[data-act="sendall"]').addEventListener('click', () => { rest.forEach(x => { ans[x] = 'declined'; }); Sound.sfx('send'); closePanel(); resolve({ pick: h, ans }); });
      panel.querySelector('[data-act="noreply"]').addEventListener('click', () => { rest.forEach(x => { ans[x] = 'noreply'; }); closePanel(); resolve({ pick: h, ans }); });
    };
    list();
  });
}
async function playWeek() {
  updateHUD();
  S.lastG = null;
  const snap = snapshot();
  if (!S.prologueDone) { await run(PROLOGUE); }
  if (S.wsDone !== S.week) { const ws = weekStartScript(); if (ws.length) await run(ws); S.wsDone = S.week; }
  clearText(); hideChar(); setScene(S.off.elec ? 'roomDark' : 'room'); Sound.play('room');
  save();
  const plan = await schedule();
  for (const id of plan.wd) { const act = ACTIONS.find(x => x.id === id); await run(act.run(S)); hideChar(); }
  if (plan.we) { const act = ACTIONS.find(x => x.id === plan.we); await run(act.run(S)); hideChar(); }
  await playWeekend();
  hideStill(); hideChar(); clearText();
  if (S.ending) { $('#black').classList.remove('on'); await afterglow(S.ending); showEnd(S.ending); clearSave(); return; }
  await showSummary(snap);
  await endOfWeek();
  if (S.loan && S.loan.missed >= 3) { await run(DEBT_END); hideChar(); clearText(); S.ending = 'debt'; await afterglow('debt'); showEnd('debt'); clearSave(); return; }
  S.week++;
  playWeek();
}
