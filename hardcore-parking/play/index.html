/* Layout: full-bleed pixel canvas. Title = stage board over the live lot. In play: one status bar on top, driving controls at the bottom, the lot auto-fitted between them. Single dark arcade look; works in portrait and landscape. */
:root {
  --ink: #0e0f0c; --ink-2: #26282a; --paper: #f3f4ef; --mute: #a6a8ab;
  --yellow: #e7d21a; --red: #e0331f; --green: #58df37; --purple: #8a74f0;
  --panel: rgba(14, 15, 12, 0.88);
  --font: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', monospace;
  --sl: max(12px, env(safe-area-inset-left, 0px)); --sr: max(12px, env(safe-area-inset-right, 0px));
  --st: max(10px, env(safe-area-inset-top, 0px)); --sb: max(12px, env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
:root { padding: 0 !important; }
body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font-family: var(--font); cursor: pointer; color: inherit; }
button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.btn { background: var(--paper); color: var(--ink); border: 0; padding: 11px 18px; font-size: 17px; letter-spacing: 0.04em; box-shadow: 0 4px 0 var(--mute), 4px 4px 0 var(--ink), 4px 8px 0 var(--ink); min-height: 44px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--mute), 4px 1px 0 var(--ink); }
.btn.primary { background: var(--yellow); box-shadow: 0 4px 0 #8f8a14, 4px 4px 0 var(--ink), 4px 8px 0 var(--ink); }
.btn.ghost { background: rgba(14,15,12,0.5); color: var(--paper); box-shadow: inset 0 0 0 2px var(--paper); }

.overlay { position: fixed; inset: 0; display: flex; padding: var(--st) var(--sr) var(--sb) var(--sl); overflow: auto; touch-action: pan-y; }
.overlay.center { align-items: center; justify-content: center; background: rgba(14,15,12,0.6); }
.card { background: var(--panel); border: 2px solid var(--paper); box-shadow: 6px 6px 0 var(--ink); padding: 18px 20px; width: min(100%, 420px); display: grid; gap: 12px; }
.card h2 { margin: 0; font-size: 26px; font-weight: normal; line-height: 1.1; }
.card p { margin: 0; font-size: 14px; line-height: 1.6; }
.row { display: flex; gap: 12px 14px; flex-wrap: wrap; }

/* title */
#title { background: linear-gradient(180deg, rgba(14,15,12,0.78), rgba(14,15,12,0.5) 55%, rgba(14,15,12,0.82)); }
#title .wrap { margin: auto; width: min(100%, 880px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 26px; align-items: start; }
.head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.logo { margin: 0; line-height: 0.95; min-width: 0; }
.langbtn { flex: none; background: var(--panel); border: 2px solid var(--paper); padding: 6px 12px; font-size: 14px; min-height: 40px; }
.langbtn:active { background: var(--paper); color: var(--ink); }
.logo .big { display: block; font-size: clamp(34px, 9.5vw, 64px); letter-spacing: 0.02em; color: var(--paper); text-shadow: 4px 4px 0 var(--ink); }
.logo .big em { font-style: normal; color: var(--yellow); display: block; }
.logo .sub { display: block; margin-top: 10px; font-size: 14px; color: var(--mute); letter-spacing: 0.3em; }
:root:lang(en) .logo .sub { letter-spacing: 0.14em; font-size: 13px; }
:root:lang(en) #revBtn, :root:lang(en) #fwdBtn { font-size: 15px; letter-spacing: 0; }
#stageGrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.sbtn { background: var(--panel); border: 2px solid var(--ink-2); padding: 7px 4px 6px; display: grid; gap: 2px; justify-items: center; min-height: 62px; }
.sbtn .num { font-size: 22px; line-height: 1; }
.sbtn .stars { font-size: 12px; letter-spacing: 0.08em; color: var(--yellow); }
.sbtn .stars i { font-style: normal; color: #5d6064; }
.sbtn[aria-pressed="true"] { border-color: var(--yellow); } .sbtn[aria-pressed="true"] .num { color: var(--yellow); }
.sbtn:disabled { opacity: 0.45; cursor: default; } .sbtn:disabled .stars { color: var(--mute); }
.sheet { background: var(--panel); border: 2px solid var(--paper); box-shadow: 6px 6px 0 var(--ink); padding: 14px 16px; display: grid; gap: 10px; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: normal; } .sheet h2 small { font-size: 12px; color: var(--yellow); letter-spacing: 0.18em; display: block; margin-bottom: 4px; }
.sheet p { margin: 0; font-size: 13px; line-height: 1.55; }
#selBest { color: var(--mute); }
.how { display: grid; gap: 6px; font-size: 13px; line-height: 1.5; background: var(--panel); border-left: 4px solid var(--yellow); padding: 10px 14px; }
.how h3 { margin: 0; font-size: 12px; letter-spacing: 0.2em; color: var(--yellow); font-weight: normal; }
.how ul { margin: 0; padding-left: 1.1em; display: grid; gap: 3px; }
kbd { font-family: var(--font); background: var(--paper); color: var(--ink); padding: 0 5px; font-size: 12px; box-shadow: 0 2px 0 var(--mute); white-space: nowrap; }
.touchOnly { display: none; } body.touch .touchOnly { display: inline; } body.touch .keyOnly { display: none; }
.left { display: grid; gap: 14px; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hudTop { position: absolute; top: var(--st); left: var(--sl); right: var(--sr); display: grid; gap: 6px; }
.bar { background: var(--panel); border: 2px solid var(--paper); display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 10px; padding: 6px 8px 6px 10px; pointer-events: auto; }
.bar .ttl { min-width: 0; }
.bar .ttl b { font-weight: normal; font-size: 16px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl b span { color: var(--yellow); margin-right: 6px; }
#hint { font-size: 12px; color: var(--mute); display: block; line-height: 1.35; min-height: 1.35em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hint.go { color: var(--green); } #hint.warn { color: var(--yellow); }
.time { text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }
.time b { font-weight: normal; font-size: 28px; } .time small { font-size: 12px; color: var(--mute); margin-left: 2px; }
.time.low b { color: var(--red); }
.tools { display: flex; gap: 6px; }
.tool { background: transparent; border: 2px solid var(--paper); width: 40px; height: 40px; font-size: 16px; display: grid; place-items: center; padding: 0; }
.tool:active { background: var(--paper); color: var(--ink); }
#tbar { grid-column: 1 / -1; height: 4px; background: var(--ink-2); position: relative; }
#tfill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--paper); }
#hold { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--green); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--panel); border: 2px solid var(--mute); color: var(--mute); padding: 1px 8px; font-size: 13px; white-space: nowrap; }
.chip.ok { border-color: var(--green); color: var(--green); }
.chip.s1 { border-color: var(--yellow); color: var(--yellow); } .chip.s2 { border-color: #ff9a2a; color: #ff9a2a; } .chip.s3 { border-color: var(--red); color: var(--red); }
#flash { position: fixed; left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(26px, 8vw, 54px); color: var(--paper); text-shadow: 4px 4px 0 var(--ink); pointer-events: none; padding: 0 12px; }
#flash.small { font-size: clamp(18px, 5vw, 30px); }
#flash.bad { color: var(--red); } #flash.good { color: var(--green); }
#flash.pop { animation: pop 1.4s steps(8) forwards; }
@keyframes pop { 0% { transform: scale(1.5); opacity: 0; } 12% { transform: scale(1); opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }

  if (opts.side) { const sm = lambert(opts.side); add(new THREE.BoxGeometry(3.6, 0.14, 1.84), sm, 0, 0.6, 0); }
  if (opts.wing) { add(new THREE.BoxGeometry(0.35, 0.06, 1.8), paint, -2.0, 1.2, 0); add(new THREE.BoxGeometry(0.15, 0.3, 0.1), dark, -2.0, 1.02, -0.7); add(new THREE.BoxGeometry(0.15, 0.3, 0.1), dark, -2.0, 1.02, 0.7); }
  if (opts.hood) add(new THREE.BoxGeometry(0.6, 0.05, 0.6), black, 1.1, 0.92, 0);
  if (opts.rally) { const fl = lambert('#b3231a'); add(new THREE.BoxGeometry(0.06, 0.4, 0.5), fl, -1.75, 0.3, -0.8); add(new THREE.BoxGeometry(0.06, 0.4, 0.5), fl, -1.75, 0.3, 0.8); const pod = lambert('#f2e86a'); for (const z of [-0.45, -0.15, 0.15, 0.45]) add(new THREE.BoxGeometry(0.1, 0.2, 0.22), pod, 2.05, 1.0, z); add(new THREE.BoxGeometry(0.9, 0.12, 0.5), black, -0.5, 1.48, 0); }

  const wheels = [];

  for (const [x, z] of [[1.35, -0.86], [1.35, 0.86], [-1.3, -0.86], [-1.3, 0.86]]) { const w = add(wg, black, x, 0.34, z, root); wheels.push(w); }

function makeParticles(max, scaleRef) {
  const geo = new THREE.BufferGeometry();

  const mat = new THREE.ShaderMaterial({
    uniforms: { scale: scaleRef },
    vertexShader: `attribute float size; attribute float alpha; attribute vec3 pcolor; varying float vA; varying vec3 vC; uniform float scale;
      void main(){ vA=alpha; vC=pcolor; vec4 mv=modelViewMatrix*vec4(position,1.0); gl_PointSize = size*scale/(-mv.z); gl_Position=projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; varying vec3 vC; void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d); float a = smoothstep(0.5,0.15,r)*vA; if(a<0.02) discard; gl_FragColor=vec4(vC,a); }`,
    transparent: true, depthWrite: false,

  P.update = (dt) => {
    for (let i = 0; i < max; i++) {
      if (P.life[i] <= 0) { alpha[i] = 0; continue; }
      P.life[i] -= dt; const k = Math.exp(-P.drag[i] * dt);
      P.vx[i] *= k; P.vz[i] *= k; P.vy[i] *= k;
      P.x[i] += P.vx[i] * dt; P.y[i] += P.vy[i] * dt; P.z[i] += P.vz[i] * dt;
      const t = 1 - Math.max(0, P.life[i]) / P.maxLife[i];

// ---- post-process: palette + Bayer dither ----
function makePost(rt) {

    uniforms: { tDiffuse: { value: rt.texture }, pal: { value: pal }, spread: { value: 0.085 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec3 pal[${N}]; uniform float spread; varying vec2 vUv;

        float m[16]; m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12.;m[5]=4.;m[6]=14.;m[7]=6.;m[8]=3.;m[9]=11.;m[10]=1.;m[11]=9.;m[12]=15.;m[13]=7.;m[14]=13.;m[15]=5.;
        float r=0.; for(int k=0;k<16;k++){ if(k==i) r=m[k]; } return r/16.0; }

        float l = dot(c, vec3(0.299,0.587,0.114));
        c = mix(vec3(l), c, 1.18);
        c += (bayer4(gl_FragCoord.xy) - 0.47) * spread;

        gl_FragColor = vec4(best,1.0);

    depthTest: false, depthWrite: false,
  });

  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
  return { scene, cam, mat };
}
